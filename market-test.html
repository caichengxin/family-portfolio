<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Portfolio | Market connection test</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f7f4;color:#17251d;margin:0;padding:24px}main{max-width:680px;margin:30px auto;background:white;border:1px solid #dce6de;border-radius:18px;padding:24px}h1{font-size:26px}small,p{color:#526357}button{background:#087b49;color:white;border:0;padding:12px 16px;border-radius:9px;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4ee;padding:16px;border-radius:10px}a{color:#087b49}.row{display:flex;flex-wrap:wrap;gap:10px}</style></head><body><main><small>FAMILY PORTFOLIO / ADMIN ONLY</small><h1>Market connection test</h1><p>Test the Alpaca IEX latest-trade feed for VTI, VXUS, VOO and BND. No assets or quotes will be written to your database.</p><p id="session">Checking your existing sign-in...</p><div class="row"><button id="test" disabled>Test market connection</button><button id="anon">Test anonymous rejection</button></div><pre id="result" aria-live="polite">Results will appear here.</pre><p><a href="./">Return to Family Portfolio / sign in</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script><script>
const BASE='https://prhcejecqiylofzergrv.supabase.co', KEY='sb_publishable_1-7e1OQif9QX_Aur1uH7Hg_sWvdLPaF';
const result=document.getElementById('result'),test=document.getElementById('test'),anon=document.getElementById('anon');
const show=x=>{result.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)};
const client=window.supabase?.createClient(BASE,KEY,{auth:{storageKey:'family-portfolio-v12-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
(async()=>{try{if(!client)throw Error('Supabase client could not load');const {data,error}=await client.auth.getUser();if(error||!data.user)throw Error('No active sign-in. Return to Family Portfolio and sign in in this same browser.');document.getElementById('session').textContent='Signed in. The server will check your Admin role.';test.disabled=false}catch(e){document.getElementById('session').textContent=e.message}})();
test.onclick=async()=>{test.disabled=true;show('Requesting market prices...');try{const {data,error}=await client.functions.invoke('market-quotes',{body:{symbols:['VTI','VXUS','VOO','BND']}});if(error){let details=null;try{if(error.context instanceof Response)details=await error.context.json()}catch{}show({error:error.message,status:error.context?.status,details})}else show(data)}catch(e){show(e.message)}finally{test.disabled=false}};
anon.onclick=async()=>{anon.disabled=true;show('Checking anonymous rejection...');try{const r=await fetch(BASE+'/functions/v1/market-quotes',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({symbols:['VTI']})});show({status:r.status,passed:r.status===401||r.status===403,message:r.status===401||r.status===403?'Anonymous request rejected.':'Unexpected response; review function configuration.'})}catch(e){show(e.message)}finally{anon.disabled=false}};
</script></body></html>
