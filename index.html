function openAccount(id){const a=acct(id);if(!a||!own(a))return;modal(`${a.name} · ${member(a.member)?.name}`,`<div class="grid metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('Calculated value',money(value(a)),missing([a]).length?'Incomplete quotes':a.broker,'chart')}${metric('Buying power',money(a.bp),age(a),'wallet')}${metric('Cash',money(a.cash),'Confirmed balance','cash')}</div><div class="actions">${button('Smart sync',`openImport('${id}')`,'scan','primary')}${button('Edit balances',`openAccountEdit('${id}')`,'edit')}${button('Add holding',`openHolding('${id}')`,'plus')}${button('Record trade',`openTrade('${id}')`,'list')}${button('Record contribution',`openContribution('${id}')`,'plus')}</div><div class="divider"></div>${a.reportedSnapshot?`<div class="notice" style="margin:12px 0"><b>Broker-reported snapshot</b><div class="row between"><span>Reported portfolio value</span><b>${money(a.reportedSnapshot.value)}</b></div><div class="row between"><span>Reported daily return</span><b>${money(a.reportedSnapshot.dayChange)} ${a.reportedSnapshot.dayPct==null?'':`(${a.reportedSnapshot.dayPct.toFixed(2)}%)`}</b></div><div class="tiny muted">${a.reportedSnapshot.gold==null?'':`Gold match rate ${a.reportedSnapshot.gold}% · `}Imported ${E(new Date(a.reportedSnapshot.importedAt).toLocaleString())}. Not a live quote or additive asset.</div></div>`:''}<h3>Holdings</h3>${holdingTable(a.holdings,true,id)}<div class="divider"></div><h3>Contributions</h3><div class="row between"><span class="muted">${session.year} · regular contributions</span><b>${money(accountContrib(id,session.year))}</b></div><div class="row between"><span class="muted">IRA match</span><b>${money(sum(data.contributions.filter(c=>c.account===id&&Number(c.year)===session.year),c=>c.match||0))}</b></div><div class="divider"></div><h3>Recent activity</h3>${activityList([a])}`,true)}
function plansPage(){const ps=data.plans.map(p=>({...p,items:p.items.filter(i=>{const a=acct(i.account);return a&&own(a)&&(admin()?session.scope==='all'||member(a.member)?.group===session.scope:session.account==='all'||session.account===a.id)})})).filter(p=>p.items.length);return heading('Investment plans',admin()?'Allocate a budget to each IRA and track member confirmations.':'Review suggested purchases and record your actual trades.',scopeSelect()+(admin()?button('New buy plan','openPlan()','plus','primary'):''),'ACTION CENTER')+`<div class="grid metrics">${metric('Pending items',String(sum(ps,p=>p.items.filter(i=>effective({...i,plan:p})==='Pending').length)),'Not executed','clock')}${metric('Reserved budget',money(sum(ps,p=>sum(p.items.filter(i=>effective({...i,plan:p})==='Pending'),i=>i.shares*p.price))),'Estimated at target price','cash')}${metric('Completed items',String(sum(ps,p=>p.items.filter(i=>i.status==='Completed').length)),'Manually confirmed','check')}</div><div class="planlist">${ps.map(p=>`<div class="card"><div class="cardhead"><div class="row"><div class="stockicon">${E(p.symbol)}</div><div><h3>Buy ${E(p.symbol)}</h3><div class="tiny muted">Target ${money(p.price)} · ${E(new Date(p.created).toLocaleDateString())}${p.expires?' · Expires '+E(p.expires):''}</div></div></div>${badge(p.items.every(i=>effective({...i,plan:p})!=='Pending')?'Closed':'Open',p.items.some(i=>effective({...i,plan:p})==='Pending')?'green':'')}</div>${p.note?`<p class="sub" style="margin-bottom:12px">${E(p.note)}</p>`:''}${p.items.map(i=>{const a=acct(i.account),s=effective({...i,plan:p});return `<div class="planrow"><div class="grow"><h4>${E(member(a.member)?.name)} · ${E(a.name)}</h4><p>${qty(i.shares)} shares · Estimated ${money(i.shares*p.price)}${i.actualPrice?' · Filled '+qty(i.actualShares)+' @ '+money(i.actualPrice):''}</p></div>${badge(s,s==='Completed'?'green':s==='Pending'?'amber':'')}${s==='Pending'?`<div class="actions">${button('Record fill',`openFill('${p.id}','${i.id}')`,'check','small primary')}${button(admin()?'Cancel':'Skip',`skipPlan('${p.id}','${i.id}')`,'close','small')}</div>`:''}</div>`}).join('')}</div>`).join('')||`<div class="card">${empty('No investment plans','New buy plans will appear here.','list')}</div>`}</div>`}
function alertsPage(){const ns=alerts().slice().sort((a,b)=>b.created.localeCompare(a.created));return heading('Notifications','All investment plans and account sync requests in one place.',button('Mark all read','markAll()','check'),'INBOX')+`<div class="notice">V1.1 stores in-app notifications locally. Email and mobile push delivery are not connected.</div><div class="alertslist">${ns.map(n=>`<div class="card alertrow ${n.read?'':'unread'}"><div class="avatar">${icon(n.kind==='sync'?'sync':'bell')}</div><div class="grow"><h4>${E(n.title)} ${!n.read?badge('New','green'):''}</h4><p>${E(n.body)}</p><div class="tiny muted" style="margin:6px 0">${admin()?E(member(n.member)?.name||'')+' · ':''}${E(new Date(n.created).toLocaleString())}</div><div class="actions">${button(n.kind==='sync'?'Open sync':'View plan',`openAlert('${n.id}')`,'chev','small')}${!n.read?button('Mark read',`markRead('${n.id}')`,'check','small'):''}</div></div></div>`).join('')||`<div class="card">${empty('All caught up','No notifications yet.','bell')}</div>`}</div>`}
function markRead(id){const a=data.alerts.find(n=>n.id===id&&(admin()||n.member===session.member));if(a){a.read=true;save();render()}}function markAll(){alerts().forEach(a=>a.read=true);save();render()}function openAlert(id){const n=data.alerts.find(x=>x.id===id&&(admin()||x.member===session.member));if(!n)return;n.read=true;save();if(n.kind==='sync'&&acct(n.account)&&own(acct(n.account))){render();openImport(n.account)}else{setPage('plans')}}
function settingsPage(){const m=member(session.member);return heading('Settings','Customize the demo and prepare your deployment.','','WORKSPACE')+`<div class="grid dashboard-grid"><div class="card"><h3>Appearance & device</h3><div class="toggle"><div class="grow"><b>Dark mode</b><div class="tiny muted">Robinhood-inspired dark interface</div></div><input aria-label="Dark mode" class="switch" type="checkbox" ${data.settings.theme==='dark'?'checked':''} onchange="theme()"></div><div class="toggle"><div class="grow"><b>Privacy mode</b><div class="tiny muted">Blur displayed financial amounts</div></div><input aria-label="Privacy mode" class="switch" type="checkbox" ${data.settings.privacy?'checked':''} onchange="privacy()"></div><div class="divider"></div><b>Install on your phone</b><p class="sub">Hosted HTTPS version: on iPhone open Safari, Share, Add to Home Screen. On Android use Chrome's install menu.</p><div style="margin-top:12px">${button('Install app','installApp()','phone','small')}</div></div><div class="card"><h3>Notifications</h3><div class="notice">Preferences are saved locally. Real delivery requires authenticated backend, Resend and Web Push configuration.</div>${[['email','Email notifications','Investment plans and sync reminders'],['push','Mobile push','Web push after deployment'],['reminders','Sync reminders','When holdings need review']].map(([k,t,d])=>`<div class="toggle"><div class="grow"><b>${t}</b><div class="tiny muted">${d}</div></div><input aria-label="${t}" type="checkbox" class="switch" ${m?.prefs[k]?'checked':''} onchange="setPref('${k}',this.checked)"></div>`).join('')}</div></div>${admin()?`<div class="grid dashboard-grid"><div class="card"><h3>Market prices</h3><div class="notice">No live API is connected by default. Use manual prices, simulated demo refresh, or an authorized read-only HTTPS quote endpoint returning the documented JSON format.</div><div class="field"><label>Quote endpoint URL (optional)</label><input class="input" id="quoteurl" value="${E(data.settings.quoteEndpoint)}" placeholder="https://your-authorized-api.example/quotes"></div><div class="toggle"><div class="grow"><b>Auto refresh</b><div class="tiny muted">Every 30 minutes while this app is open</div></div><input class="switch" type="checkbox" id="quoteauto" ${data.settings.quoteAuto?'checked':''}></div><div class="actions" style="margin-top:12px">${button('Save market settings','saveMarket()','check','small primary')}${button('Edit prices','openPrices()','edit','small')}${button('Refresh','refreshQuotes()','sync','small')}</div></div><div class="card"><h3>Data health</h3><div class="field" style="margin-top:12px"><label>Flag accounts after (days)</label><input class="input" type="number" min="1" max="90" id="staledays" value="${data.settings.staleDays}"></div><div style="margin-top:10px">${button('Save threshold','saveHealth()','check','small')}</div><div class="divider"></div><b>Demo data & backup</b><p class="sub">Data is saved in this browser only. Do not enter real financial data until secure accounts and RLS are deployed.</p><div class="actions" style="margin-top:12px">${button('Export JSON','exportJSON()','download','small')}${button('Export CSV','exportCSV()','download','small')}${button('Reset demo','resetDemo()','trash','danger small')}</div></div></div>`:''}<div class="card" style="margin-top:16px"><h3>Deployment status</h3><div class="tablewrap"><table><tbody>${[['Family groups & IRA accounts','Working locally'],['Admin / member access','Simulated, not secure authentication'],['Screenshot OCR','Browser OCR, internet needed for engine'],['Market data','Demo/manual or configured endpoint'],['Email / push','UI and preferences only'],['Supabase','Not connected'],['PWA install','HTTPS hosting required']].map(([a,b])=>`<tr><td>${a}</td><td class="muted">${b}</td></tr>`).join('')}</tbody></table></div></div>`}
function setPref(k,v){const m=member(session.member);if(m){m.prefs[k]=v;save();toast('Preference saved locally')}}function saveMarket(){const v=$('#quoteurl').value.trim();if(v&&!/^https:\/\//i.test(v)){toast('Use an HTTPS endpoint.');return}data.settings.quoteEndpoint=v;data.settings.quoteAuto=$('#quoteauto').checked;save();scheduleQuotes();toast('Market settings saved');render()}function saveHealth(){const v=Number($('#staledays').value);if(!Number.isInteger(v)||v<1||v>90){toast('Enter 1 to 90 days.');return}data.settings.staleDays=v;save();render();toast('Data health threshold saved')}
function modal(title,body,wide=false){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modalhead"><h2>${E(title)}</h2><button class="iconbtn" aria-label="Close" onclick="closeModal()">${icon('close')}</button></div>${body}</section></div>`;document.body.style.overflow='hidden'}function closeModal(){$('#modalroot').innerHTML='';document.body.style.overflow='';if(typeof importState!=='undefined')importState=null}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});const field=(l,id,v='',t='text',extra='',hint='')=>`<div class="field"><label for="${id}">${E(l)}</label><input class="input" id="${id}" type="${t}" value="${E(v)}" ${extra}>${hint?`<small>${E(hint)}</small>`:''}</div>`;const sel=(l,id,opts,v)=>`<div class="field"><label for="${id}">${E(l)}</label><select class="select" id="${id}">${opts.map(o=>`<option value="${E(o[0])}" ${o[0]===v?'selected':''}>${E(o[1])}</option>`).join('')}</select></div>`;const foot=(label,action,extra='')=>`<div class="error" id="formerror" role="alert"></div><div class="modalfoot">${extra}${button('Cancel','closeModal()')}${button(label,action,'check','primary')}</div>`;function err(s){const el=$('#formerror');if(el)el.textContent=s;else toast(s)}const str=id=>$(id)?.value.trim()||'';function num(id,optional=false){const v=str(id);return v===''?(optional?null:NaN):Number(v)}const nonneg=n=>Number.isFinite(n)&&n>=0;const positive=n=>Number.isFinite(n)&&n>0;const validSymbol=s=>/^[A-Z][A-Z0-9.\-]{0,9}$/.test(s);const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s));function done(msg){save();closeModal();render();toast(msg)}
function openGroupEdit(id=''){if(!admin())return;const g=group(id);modal(g?'Rename group':'New family group',`<div class="formgrid">${field('Group name','gname',g?.name||'','text','maxlength="60"')}</div>${foot('Save group',`saveGroup('${id}')`)}`)}function saveGroup(id){if(!admin())return;const n=str('#gname');if(!n||data.groups.some(g=>g.id!==id&&g.name.toLowerCase()===n.toLowerCase()))return err('Enter a unique group name.');const g=group(id);if(g)g.name=n;else data.groups.push({id:uid(),name:n});done('Family group saved')}
function openMemberEdit(id=''){if(!admin())return;const m=member(id);if(!data.groups.length)return openGroupEdit();modal(m?'Edit member':'Add demo member',`<div class="formgrid">${field('Display name','mname',m?.name||'','text','maxlength="60"')}${sel('Primary household','mgroup',data.groups.map(g=>[g.id,g.name]),m?.group||data.groups[0].id)}${field('Email (optional)','memail',m?.email||'','email','maxlength="160"')}${field('Individual contribution limit ($) · '+session.year,'mlimit',limitFor(m,session.year)??'','number','min="0" step="0.01"','Verify eligibility; leave blank if not configured.')}</div><div class="notice">This creates a local demo identity, not an authenticated account or email invitation.</div>${foot('Save member',`saveMember('${id}')`)}`)}function saveMember(id){if(!admin())return;const n=str('#mname'),g=str('#mgroup'),email=str('#memail'),limit=num('#mlimit',true);if(!n||!group(g)||limit!==null&&!nonneg(limit)||email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Check name, group, email and contribution limit.');const m=member(id);if(m){Object.assign(m,{name:n,group:g,email});m.annualLimits={...(m.annualLimits||{}),[session.year]:limit};if(session.year===2026)m.limit=limit}else data.members.push({id:uid(),name:n,group:g,email,limit:session.year===2026?limit:null,annualLimits:{[session.year]:limit},prefs:{email:true,push:true,reminders:true}});done('Member saved locally')}
function openAccountEdit(id=''){const a=acct(id);if(a&&!own(a))return;const ms=admin()?data.members:data.members.filter(m=>m.id===session.member);if(!ms.length)return toast('Add a member first.');modal(a?'Edit account & balances':'Add IRA account',`<div class="formgrid">${sel('Member','amember',ms.map(m=>[m.id,m.name]),a?.member||ms[0].id)}${sel('Account type','atype',[['Roth IRA','Roth IRA'],['Traditional IRA','Traditional IRA']],a?.type||'Roth IRA')}${field('Account nickname','aname',a?.name||'','text','maxlength="60" placeholder="e.g. Roth IRA"')}${field('Brokerage','abroker',a?.broker||'Robinhood','text','maxlength="60"')}${field('Cash balance ($)','acash',a?.cash??0,'number','min="0" step="0.01"','Actual cash, not buying power.')}${field('Buying power ($)','abp',a?.bp??0,'number','min="0" step="0.01"','Available to buy at broker.')}</div>${a?'<div class="notice">Changing the account owner is disabled for existing accounts. Balance changes are logged.</div>':'<div class="notice">Add holdings after creating the account. Cash and buying power are stored separately.</div>'}${foot('Save account',`saveAccount('${id}')`)}`);if(a)$('#amember').disabled=true}function saveAccount(id){const a=acct(id),m=a?.member||str('#amember'),type=str('#atype'),name=str('#aname')||type,broker=str('#abroker')||'Robinhood',cash=num('#acash'),bp=num('#abp');if((a&&!own(a))||!member(m)||(!admin()&&m!==session.member)||!['Roth IRA','Traditional IRA'].includes(type)||!nonneg(cash)||!nonneg(bp))return err('Check account and nonnegative balances.');if(a){const prev=clone(a);Object.assign(a,{type,name,broker,cash:round(cash),bp:round(bp),updated:now(),method:'Manual'});addActivity(a.id,'Manual balance update',`Cash ${money(a.cash)} · Buying power ${money(a.bp)}`,prev)}else{const id=uid();data.accounts.push({id,member:m,type,name,broker,cash:round(cash),bp:round(bp),updated:now(),method:'Manual',holdings:[]});addActivity(id,'Account created',name)}done('Account saved')}
function openUpdatePicker(){const as=scopeAccounts();if(!as.length)return openAccountEdit();modal('Update portfolio',`<div class="field">${sel('Choose IRA account','updateaccount',as.map(a=>[a.id,`${member(a.member)?.name} · ${a.name}`]),as[0].id)}</div><div class="grid" style="margin-top:14px">${button('Import Robinhood screenshot',"openImport(str('#updateaccount'))",'scan','primary')}${button('Edit balances / holdings',"openAccount(str('#updateaccount'))",'edit')}${button('Record trade',"openTrade(str('#updateaccount'))",'list')}${button('Record contribution',"openContribution(str('#updateaccount'))",'plus')}</div>`)}
function openHolding(id,s=''){const a=acct(id);if(!a||!own(a))return;const h=a.holdings.find(x=>x.symbol===s);modal(h?'Edit holding':'Add holding',`<div class="formgrid">${field('Stock / ETF symbol','hsymbol',h?.symbol||'','text','maxlength="10" placeholder="VOO"')}${field('Shares','hshares',h?.shares??'','number','min="0" step="any"')}${field('Average cost ($, optional)','hcost',h?.cost??'','number','min="0" step="any"')}${admin()?field('Market price ($, optional)','hprice',price(s)??'','number','min="0.000001" step="any"','Shared quote across accounts.'):''}</div><div class="notice">Manual holding edits do not change cash or buying power. Use Record trade for a purchase or sale.</div>${foot('Save holding',`saveHolding('${id}','${E(s)}')`,h?button('Remove holding',`deleteHolding('${id}','${E(s)}')`,'trash','danger'):'')}`);if(h)$('#hsymbol').disabled=true}function saveHolding(id,old){const a=acct(id);if(!a||!own(a))return;const s=str('#hsymbol').toUpperCase(),q=num('#hshares'),c=num('#hcost',true),p=num('#hprice',true);if(!validSymbol(s)||!positive(q)||c!==null&&!nonneg(c)||p!==null&&!positive(p)||!old&&a.holdings.some(h=>h.symbol===s))return err('Enter a valid unique symbol, positive shares and valid prices.');const before=clone(a),h=a.holdings.find(x=>x.symbol===old);if(h)Object.assign(h,{shares:q,cost:c});else a.holdings.push({symbol:s,shares:q,cost:c});if(admin()&&p!==null){data.prices[s]={price:p,at:now(),source:'Manual'};data.lastQuote=now()}a.updated=now();a.method='Manual';addActivity(id,'Holding updated',`${s} · ${qty(q)} shares`,before);done('Holding saved');openAccount(id)}function deleteHolding(id,s){const a=acct(id);if(!a||!own(a)||!confirm(`Remove ${s} from ${a.name}? This is a manual correction, not a recorded sale.`))return;const before=clone(a);a.holdings=a.holdings.filter(h=>h.symbol!==s);a.updated=now();a.method='Manual';addActivity(id,'Holding removed',s,before);done('Holding removed');openAccount(id)}
function tradeError(a,s,side,q,p,excluded=0){if(!validSymbol(s)||!positive(q)||!positive(p))return 'Enter a valid symbol, positive shares and price.';const h=a.holdings.find(x=>x.symbol===s),amount=round(q*p);if(side==='BUY'&&(amount>a.bp+0.001||amount>a.cash+0.001||amount>Math.max(0,a.bp-reserve(a.id)+excluded)+0.001))return 'Trade exceeds cash or unreserved buying power. Confirm brokerage balances first.';if(side==='SELL'&&(!h||q>h.shares+1e-8))return 'Not enough shares to sell.';return ''}
function applyTrade(a,s,side,q,p){const before=clone(a),h=a.holdings.find(x=>x.symbol===s),amount=round(q*p);if(side==='BUY'){if(h){const old=h.shares;h.cost=h.cost==null?null:(h.cost*old+p*q)/(old+q);h.shares=+(old+q).toFixed(8)}else a.holdings.push({symbol:s,shares:q,cost:p});a.cash=round(a.cash-amount);a.bp=round(a.bp-amount)}else{h.shares=+(h.shares-q).toFixed(8);if(h.shares<=1e-8)a.holdings=a.holdings.filter(x=>x!==h);a.cash=round(a.cash+amount);/* unsettled sale proceeds are not automatically credited to buying power */}if(!Number.isFinite(price(s)))data.prices[s]={price:p,at:now(),source:'Recorded fill'};a.updated=now();a.method='Transaction';addActivity(a.id,side==='BUY'?'Buy recorded':'Sell recorded',`${s} · ${qty(q)} @ ${money(p)} · ${money(amount)}`,before)}
function openTrade(id){const a=acct(id);if(!a||!own(a))return;modal('Record actual trade',`<div class="formgrid">${sel('Side','tside',[['BUY','Buy'],['SELL','Sell']],'BUY')}${field('Symbol','tsymbol','','text','maxlength="10" placeholder="VOO"')}${field('Executed shares','tshares','','number','min="0" step="any"')}${field('Executed price ($)','tprice','','number','min="0" step="any"')}</div><div class="notice">Only record a completed trade from your broker. Buy reduces cash and buying power; sell increases estimated cash, but buying power must be confirmed manually.</div><div class="row between"><span class="muted">Unreserved buying power</span><b>${money(free(a))}</b></div>${foot('Record trade',`saveTrade('${id}')`)}`)}function saveTrade(id){const a=acct(id);if(!a||!own(a))return;const s=str('#tsymbol').toUpperCase(),side=str('#tside'),q=num('#tshares'),p=num('#tprice'),e=tradeError(a,s,side,q,p);if(e)return err(e);applyTrade(a,s,side,q,p);done('Trade recorded. Verify brokerage balances.');openAccount(id)}
function openContribution(id){const a=acct(id);if(!a||!own(a))return;modal('Record IRA contribution',`<div class="formgrid">${field('Tax year','cyear',session.year,'number','min="2000" max="2100"')}${field('Contribution amount ($)','camount','','number','min="0" step="0.01"')}${field('Robinhood match ($)','cmatch',0,'number','min="0" step="0.01"')}${field('Contribution date','cdate',new Date().toISOString().slice(0,10),'date')}</div><div class="notice">Records contribution history only. Update actual cash/buying power separately to avoid double-counting a deposit already included in brokerage data.</div><div class="row between"><span class="muted">Configured individual limit</span><b>${money(limitFor(member(a.member),session.year))}</b></div>${foot('Record contribution',`saveContribution('${id}')`)}`)}function saveContribution(id){const a=acct(id);if(!a||!own(a))return;const y=num('#cyear'),amount=num('#camount'),match=num('#cmatch'),d=str('#cdate'),limit=limitFor(member(a.member),y);if(!Number.isInteger(y)||y<2000||y>2100||!positive(amount)||!nonneg(match)||!validDate(d))return err('Enter a valid tax year, amount, match and date.');if(limit!=null&&contrib(a.member,y)+amount>limit&&!confirm('This exceeds the configured annual limit across all of this member’s IRAs. Record anyway as an actual contribution?'))return;data.contributions.push({id:uid(),account:id,year:y,amount:round(amount),match:round(match),date:d});addActivity(id,'Contribution recorded',`Tax year ${y} · ${money(amount)} · match ${money(match)}`);done('Contribution recorded');openAccount(id)}

async function runOCR(){const files=Array.from($('#ocrfiles')?.files||[]),st=importState,token=st?.token,status=$('#ocrstatus');if(st.busy)return;if(!files.length){status.textContent='Select at least one image.';return}if(files.length>8||files.some(f=>f.size>15*1024*1024)){status.textContent='Use at most 8 images, each under 15 MB.';return}st.busy=true;let worker;const alive=()=>importState?.token===token&&$('#ocrtext');try{status.textContent='Loading OCR engine…';await loadOCR();worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(alive())status.textContent=`${m.status} ${Math.round((m.progress||0)*100)}%`}});let texts=[];for(let i=0;i<files.length;i++){if(!alive())return;status.textContent=`Scanning image ${i+1} of ${files.length}…`;await worker.setParameters({tessedit_pageseg_mode:'3'});const res=await worker.recognize(files[i]);let raw=res.data.text;const isPos=/your\s+position/i.test(raw),isList=/stocks\s*(?:&|and)\s*etf/i.test(raw)&&/\bshares?\b/i.test(raw);if(isPos){await worker.setParameters({tessedit_pageseg_mode:'6'});const ticker=(await worker.recognize(await rhCrop(files[i],[.39,.087,.61,.124]))).data.text.trim().replace(/\s+/g,' '),account=(await worker.recognize(await rhCrop(files[i],[.025,.81,.43,.90]))).data.text.trim().replace(/\s+/g,' '),header=(await worker.recognize(await rhCrop(files[i],[.34,.047,.63,.12]))).data.text;const price=header.match(/\$[0-9,.]+/)?.[0]||'';raw+=`\nTicker crop: ${ticker}\nAccount crop: ${account}\nPrice crop: ${price}`}else if(isList){/* The supplied mobile list places tickers in the left column. Use the crop only when it contains at least as many share rows as the full scan. */await worker.setParameters({tessedit_pageseg_mode:'6'});const crop=(await worker.recognize(await rhCrop(files[i],[.035,.42,.36,.76]))).data.text;if((crop.match(/\bshares?\b/gi)||[]).length>=(raw.match(/\bshares?\b/gi)||[]).length)raw+='\nHoldings crop:\n'+crop}texts.push(raw)}if(alive()){$('#ocrtext').value=texts.join(RH_SEP);status.textContent='Scan complete. Check the account and every detected value.';parseImport()}}catch(e){if(alive())status.textContent=`OCR unavailable: ${e.message}. Paste extracted text or update manually.`}finally{st.busy=false;if(worker)await worker.terminate()}}
function parseImport(){const st=importState;if(!st)return;const raw=str('#ocrtext');if(!raw)return toast('Paste or scan some text first.');const a=acct(st.account);if(!a||!own(a))return;st.raw=raw;const seen=new Set();st.docs=splitRobinhood(raw).map((s,i)=>{const k=s.replace(/\s+/g,' ').trim(),duplicate=seen.has(k);seen.add(k);return {...parseRobinhood(s),index:i+1,duplicate}});st.selected=st.docs.map(d=>!d.duplicate&&d.type===a.type);renderReview()}
function selectImportDoc(i,checked){importState.selected[i]=checked;renderReview()}
function renderReview(){const st=importState,a=acct(st.account);const chosen=st.docs.filter((d,i)=>st.selected[i]&&!d.duplicate&&(!d.type||d.type===a.type));const merged=mergeRobinhood(chosen,a);st.merged=merged;const excluded=st.docs.filter(d=>d.type&&d.type!==a.type&&!d.duplicate);const oldTotals=y=>accountContrib(a.id,y);$('#importreview').innerHTML=`<div class="divider"></div><div class="row between"><h3>1. Check screenshot routing</h3>${badge(chosen.length+' selected','green')}</div><div class="notice">Target: <b>${E(member(a.member)?.name)} · ${E(a.name)}</b>. A detected different IRA is excluded. Select the other account above to review it separately. Only one member is in scope.</div>${st.docs.map((d,i)=>{const wrong=d.type&&d.type!==a.type,disable=d.duplicate||wrong;return `<label class="row" style="padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start"><input type="checkbox" ${st.selected[i]?'checked':''} ${disable?'disabled':''} onchange="selectImportDoc(${i},this.checked)" style="margin-top:4px"><div class="grow"><b>Screenshot ${d.index} · ${E(d.kind)}</b><div class="tiny muted">${E(d.type||'IRA not detected — manually confirm')} · ${d.rows.length} holding(s)</div>${d.warnings.map(w=>`<div class="tiny warning">${E(w)}</div>`).join('')}</div>${badge(d.duplicate?'Duplicate':wrong?'Other IRA':!d.type?'Confirm IRA':'Matched',disable?'amber':d.type?'green':'amber')}</label>`}).join('')}${excluded.length?'<div class="notice warn">Different IRA screenshots are not included in this save. Use the target selector to import them separately if they belong to this member.</div>':''}${chosen.length?`<div class="divider"></div><h3>2. Review account snapshot</h3>${merged.conflicts.length?`<div class="notice warn">Conflicting values: ${E([...new Set(merged.conflicts)].join(', '))}. Verify the latest screenshot values.</div>`:''}<div class="formgrid" style="margin-top:12px">${field('Buying power ($)','ibp',merged.bp??'','number','min="0" step="0.01"',`Previous: ${money(a.bp)}. Blank = unchanged.`)}${field('Cash balance ($)','icash',merged.cash??'','number','min="0" step="0.01"',`Previous: ${money(a.cash)}. Not inferred from buying power.`)}${field('Broker-reported portfolio value ($)','ivalue',merged.portfolio??'','number','min="0" step="0.01"','Reference snapshot only; not added to calculated assets.')}${field('Today return ($)','iday',merged.dayChange??'','number','step="0.01"')}${field('Today return (%)','idaypct',merged.dayPct??'','number','step="0.01"')}${field('Robinhood Gold match rate (%)','igold',merged.gold??'','number','min="0" max="100" step="0.01"')}</div><div class="divider"></div><h3>3. Review annual contribution totals</h3><div class="formgrid">${field('Tax year','iyear',merged.year??'','number','min="2000" max="2100"')}${field('Year-to-date contributions ($)','icontrib',merged.contribution??'','number','min="0" step="0.01"',merged.year?`Recorded account total: ${money(oldTotals(merged.year))}`:'Blank = unchanged.')}${field('Year-to-date IRA match ($)','imatch',merged.match??'','number','min="0" step="0.01"','Match is separate from regular contributions.')}</div><div class="notice">These are cumulative totals, not new deposits. Saving the same screenshot again does not add another contribution. Cash is not changed by contribution reconciliation.</div><div class="divider"></div><h3>4. Review holdings</h3><p class="sub">Position details preserve full fractional-share precision. Missing holdings are not removed.</p><div id="importrows" class="rh-review-rows">${merged.rows.map(reviewRow).join('')}</div><div class="actions" style="margin:10px 0">${button('Add row','addImportRow()','plus','small')}</div><label class="row" style="align-items:flex-start;padding:10px 0"><input id="useRefPrices" type="checkbox"><span class="smalltext">Use screenshot prices only where a symbol has no existing quote (not live quotes). Existing shared prices stay unchanged.</span></label><label class="row" style="align-items:flex-start;padding:10px 0"><input id="confirmRouting" type="checkbox"><span class="smalltext"><b>I verified the member, IRA account, ticker symbols, share quantities and all amounts.</b></span></label>${foot('Confirm & sync','saveImport()')}`:'<div class="notice warn">No screenshots selected for this account. Check the detected IRA, or manually confirm a screenshot with an unknown IRA type.</div>'}`}
function reviewRow(h,i){const old=acct(importState.account).holdings.find(x=>x.symbol===h.symbol);return `<div class="irow card" style="padding:14px;margin-top:9px"><div class="row between"><b>${E(h.kind==='detail'?'Position detail':h.kind==='list'?'Holdings list':'Manual row')}</b><div class="row">${h.conflict||h.needsCheck?badge('Verify','amber'):h.precisionKept?badge('Precision kept','green'):badge('Review')}<button class="iconbtn" aria-label="Remove import row" onclick="this.closest('.irow').remove()">${icon('trash')}</button></div></div><div class="formgrid" style="margin-top:9px"><div class="field"><label>Ticker</label><input class="input isymbol" aria-label="Symbol" value="${E(h.symbol)}" maxlength="10"></div><div class="field"><label>Shares</label><input class="input ishares" aria-label="Shares" type="number" min="0" step="any" value="${E(h.shares??'')}"></div><div class="field"><label>Average cost ($)</label><input class="input icost" aria-label="Average cost" type="number" min="0" step="any" value="${E(h.cost??'')}"></div><div class="field"><label>Screenshot price ($)</label><input class="input irefprice" aria-label="Screenshot price" type="number" min="0" step="any" value="${E(h.refPrice??'')}"></div></div><div class="tiny muted">${old?'Previous '+qty(old.shares)+' shares · cost '+money(old.cost):'New ticker'}${h.marketValue!=null?' · Screenshot market value '+money(h.marketValue):''}</div>${h.needsCheck?`<div class="tiny warning">OCR may be ambiguous${h.ocrOriginal?' (read '+E(h.ocrOriginal)+')':''}. Verify the proposed ticker and shares.</div>`:''}${h.needsCheck||h.conflict?'<label class="row smalltext" style="margin-top:8px"><input type="checkbox" class="iverified"> I verified this holding against Robinhood.</label>':''}${h.conflict?'<div class="tiny warning">Different shares detected. Detail preferred; verify actual quantity.</div>':''}</div>`}
function addImportRow(){$('#importrows').insertAdjacentHTML('beforeend',reviewRow({symbol:'',shares:null,cost:null},0))}
function saveImport(){const st=importState,a=acct(st?.account);if(!a||!own(a))return;if(a.updated!==st.version)return err('The account changed during import. Reopen Smart Sync.');if(!$('#confirmRouting')?.checked)return err('Confirm the member, IRA and detected values first.');if($$('.iverified').some(x=>!x.checked))return err('Verify every flagged holding individually before saving.');const bp=num('#ibp',true),cash=num('#icash',true),portfolio=num('#ivalue',true),day=num('#iday',true),dayPct=num('#idaypct',true),gold=num('#igold',true),year=num('#iyear',true),contribution=num('#icontrib',true),match=num('#imatch',true),usePrices=$('#useRefPrices').checked;const rows=$$('.irow').map(r=>{const read=s=>{const v=r.querySelector(s).value.trim();return v===''?null:Number(v)};return {symbol:r.querySelector('.isymbol').value.trim().toUpperCase(),shares:read('.ishares'),cost:read('.icost'),refPrice:read('.irefprice')}});if([bp,cash,portfolio,gold,contribution,match].some(v=>v!==null&&!nonneg(v))||gold!==null&&gold>100||[day,dayPct].some(v=>v!==null&&!Number.isFinite(v))||rows.some(r=>!validSymbol(r.symbol)||!positive(r.shares)||r.cost!==null&&!nonneg(r.cost)||r.refPrice!==null&&!positive(r.refPrice))||new Set(rows.map(r=>r.symbol)).size!==rows.length)return err('Check amounts, positive share quantities and unique ticker symbols.');if((contribution!==null||match!==null)&&(!Number.isInteger(year)||year<2000||year>2100))return err('Choose the tax year for the cumulative contribution totals.');if(!rows.length&&[bp,cash,portfolio,day,dayPct,gold,contribution,match].every(v=>v===null))return err('No values to update.');const before=clone(a),oldContrib=year?accountContrib(a.id,year):0,oldMatch=year?sum(data.contributions.filter(c=>c.account===a.id&&Number(c.year)===year),c=>c.match||0):0,delta=contribution===null?0:round(contribution-oldContrib),matchDelta=match===null?0:round(match-oldMatch),limit=limitFor(member(a.member),year);if(contribution!==null&&limit!=null&&contrib(a.member,year)+delta>limit&&!confirm('The combined reported IRA contributions exceed the configured individual limit. Save the confirmed broker total anyway?'))return;if((delta<0||matchDelta<0)&&!confirm('The screenshot total is lower than recorded history. Reconcile to this confirmed total?'))return;for(const h of rows){const old=a.holdings.find(x=>x.symbol===h.symbol),row={symbol:h.symbol,shares:h.shares,cost:h.cost};if(old){Object.assign(old,row)}else a.holdings.push(row);if(usePrices&&h.refPrice!==null&&!Number.isFinite(price(h.symbol)))data.prices[h.symbol]={price:h.refPrice,at:now(),source:'Screenshot reference (import time)'}}if(bp!==null)a.bp=round(bp);if(cash!==null)a.cash=round(cash);if([portfolio,day,dayPct,gold].some(x=>x!==null)){const snap=a.reportedSnapshot||{};a.reportedSnapshot={...snap,...(portfolio===null?{}:{value:round(portfolio)}),...(day===null?{}:{dayChange:round(day)}),...(dayPct===null?{}:{dayPct}),...(gold===null?{}:{gold}),importedAt:now()}}if(delta||matchDelta)data.contributions.push({id:uid(),account:a.id,year,amount:delta,match:matchDelta,date:new Date().toISOString().slice(0,10),source:'Screenshot total reconciliation'});a.updated=now();a.method='Screenshot';addActivity(a.id,'Screenshot sync',`${rows.length} reviewed holding(s); ${delta||matchDelta?'annual totals reconciled':'contributions unchanged'}; ${bp!==null?'buying power updated':'buying power unchanged'}`,before);importState=null;done('Portfolio synced locally');openAccount(a.id)}
function openPrices(){if(!admin())return;const symbols=[...new Set([...Object.keys(data.prices),...data.accounts.flatMap(a=>a.holdings.map(h=>h.symbol))])].sort();modal('Edit market prices',`<div class="notice">Manual and simulated prices are not live market quotes. The source is saved for each symbol.</div>${symbols.map(s=>`<div class="row" style="padding:9px 0"><div class="grow"><b>${E(s)}</b><div class="tiny muted">${E(data.prices[s]?.source||'Missing')}</div></div><input class="input manualprice" aria-label="Price for ${E(s)}" data-symbol="${E(s)}" type="number" min="0" step="any" style="width:140px" value="${E(price(s)??'')}"></div>`).join('')}${foot('Save prices','savePrices()')}`)}function savePrices(){if(!admin())return;const rows=$$('.manualprice').map(x=>({symbol:x.dataset.symbol,value:x.value.trim()}));if(rows.some(r=>r.value!==''&&!positive(Number(r.value))))return err('Enter positive prices or leave missing values blank.');for(const r of rows)if(r.value!==''&&Number(r.value)!==price(r.symbol))data.prices[r.symbol]={price:Number(r.value),at:now(),source:'Manual'};data.lastQuote=now();done('Manual prices updated')}
async function refreshQuotes(){if(!admin()){toast('Ask the admin to refresh market prices.');return}const symbols=[...new Set(data.accounts.flatMap(a=>a.holdings.map(h=>h.symbol)))];if(!symbols.length)return toast('No symbols to refresh.');if(!data.settings.quoteEndpoint){if(!confirm('No market API is connected. Simulate a small price movement using sample prices?'))return;for(const s of symbols)if(positive(price(s))&&data.prices[s].source==='Demo')data.prices[s]={price:round(price(s)*(1+(Math.random()-.5)*.02)),at:now(),source:'Demo'};data.lastQuote=now();captureSnapshot();save();render();return toast('Simulated demo prices updated — not live market data.')}try{const u=new URL(data.settings.quoteEndpoint);u.searchParams.set('symbols',symbols.join(','));const resp=await fetch(u,{headers:{Accept:'application/json'},cache:'no-store',signal:AbortSignal.timeout(15000)});if(!resp.ok)throw Error(`HTTP ${resp.status}`);const payload=await resp.json();if(!payload.prices||typeof payload.prices!=='object')throw Error('Invalid quote response');let count=0;for(const s of symbols){const p=payload.prices[s];if(p&&positive(Number(p.price))&&typeof p.asOf==='string'&&!Number.isNaN(Date.parse(p.asOf))&&Date.parse(p.asOf)<=Date.now()+300000&&(!data.prices[s]||Date.parse(p.asOf)>=Date.parse(data.prices[s].at)||['Demo','Manual','Recorded fill'].includes(data.prices[s].source))){data.prices[s]={price:Number(p.price),at:p.asOf,source:String(p.source||'External').slice(0,60)};count++}}if(!count)throw Error('No valid new quotes');data.lastQuote=now();captureSnapshot();save();render();toast(`${count}/${symbols.length} symbols updated. Check source and timestamp.`)}catch(e){toast(`Quote refresh failed: ${e.message}. Existing prices retained.`)}}function scheduleQuotes(){clearInterval(quoteTimer);if(data.settings.quoteAuto&&data.settings.quoteEndpoint)quoteTimer=setInterval(()=>{if(admin())refreshQuotes()},30*60*1000)}function captureSnapshot(){data.snapshots.push({at:now(),accounts:data.accounts.map(a=>({id:a.id,value:value(a),cash:a.cash,partial:missing([a]).length>0}))});if(data.snapshots.length>1000)data.snapshots.shift()}
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){if(!admin())return;download('family-portfolio-demo-backup.json',JSON.stringify(data,null,2),'application/json')}function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCSV(){const rows=[['Group','Member','Account','Type','Brokerage','Cash','Buying Power','Symbol','Shares','Average Cost','Market Price','Price Source','Price As Of','Last Portfolio Sync']];for(const a of scopeAccounts()){const hs=a.holdings.length?a.holdings:[{}];for(const h of hs)rows.push([group(member(a.member)?.group)?.name,member(a.member)?.name,a.name,a.type,a.broker,a.cash,a.bp,h.symbol,h.shares,h.cost,price(h.symbol),data.prices[h.symbol]?.source,data.prices[h.symbol]?.at,a.updated])}download('family-portfolio-holdings.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}function resetDemo(){if(admin()&&confirm('Reset all local demo data? Export a backup first if needed.')){data=seed();session={role:'admin',member:'m1',page:'home',scope:'all',account:'all',year:2026};save();render();toast('Demo reset')}}
function installApp(){if(pendingInstall){pendingInstall.prompt();pendingInstall.userChoice.then(()=>{pendingInstall=null})}else toast('Host on HTTPS first. iPhone: Safari → Share → Add to Home Screen. Android: Chrome → Install app.')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e});if('serviceWorker'in navigator&&['http:','https:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();scheduleQuotes();
